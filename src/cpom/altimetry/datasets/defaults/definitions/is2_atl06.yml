mission: "is2"
long_name: "ICESat-2 ATL06 Land Ice"
yyyymm_str_fname_indices: [-33,-25]
file_backend: "h5py"
dataset_epoch: "2018-01-01T00:00:00"
search_pattern: "**/ATL06_*_*.h5"
beams: ["gt1l", "gt1r", "gt2l", "gt2r", "gt3l", "gt3r"]

params:
  latitude: "land_ice_segments/latitude"
  longitude: "land_ice_segments/longitude"
  elevation: "land_ice_segments/h_li"
  elevation_err: "land_ice_segments/h_li_sigma"
  time: "land_ice_segments/delta_time"
  uncertainty_total: "land_ice_segments/h_li_sigma"
  geolocation_err: "land_ice_segments/sigma_geo_h"

default_qual_correction: cpom.altimetry.datasets.defaults.quality_correction_helper.get_is2_qual_mask
