mission: "env"
long_name: "ENVISAT FDR4ALT Land Ice"
search_pattern: "**/EN1_F4A_ALT_TDP_LI_*.nc"
file_backend: "netcdf4"
yyyymm_str_fname_indices: [-38, -30]
dataset_epoch: "1950-01-01T00:00:00"

params:   
  latitude: "expert/ice_sheet_lat_poca"
  longitude: "expert/ice_sheet_lon_poca"
  latitude_nadir: "expert/latitude"
  longitude_nadir: "expert/longitude"
  elevation: "expert/ice_sheet_elevation_ice1_roemer"
  power: "expert/sigma0_ice1"
  time: "expert/time"
  mode: "expert/chirp_band"

default_elev_correction: cpom.altimetry.datasets.defaults.elevation_correction_helper.get_fdr4alt_envisat_elev
default_qual_correction: cpom.altimetry.datasets.defaults.quality_correction_helper.get_fdr4alt_qual_mask